# Weekly dependency updates for the build/test toolchain.
# All npm dependencies are devDependencies (the shipped userscript has no
# runtime deps), so updates are grouped into a single PR to keep noise low.
# Security advisories still open individual PRs immediately.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-toolchain:
        patterns:
          - "*"
    open-pull-requests-limit: 5
